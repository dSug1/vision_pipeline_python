name: Deploy Part Zero-bis to GitHub Pages

# Builds Hand_detection/Part_Zero_Bis_Web (a Vite/Three.js/MediaPipe static
# site — see Hand_detection/Claude/PART_ZERO_BIS.md) and deploys it to
# GitHub Pages. Pages serves over HTTPS, which getUserMedia() requires
# (Specification.md §9), and static hosting fits the project's no-backend
# design (§10).
#
# One-time manual step this workflow can't do for you: in the repo's
# Settings -> Pages, set Source to "GitHub Actions".
#
# Triggers on push to ANY branch (no `branches:` filter below), not just
# main — this repo's workflow is a chain of version-numbered branches that
# never get merged into main (main is 90+ commits stale), so "whatever
# branch you just pushed" is what ends up live on Pages. A push to a
# different branch later simply overwrites what's currently live (the
# `concurrency` group below ensures only the latest deploy wins, not a race).

on:
  push:
    paths:
      - "Hand_detection/Part_Zero_Bis_Web/**"
      - ".github/workflows/deploy-part-zero-bis.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Hand_detection/Part_Zero_Bis_Web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Hand_detection/Part_Zero_Bis_Web/package-lock.json

      - run: npm ci
      # npm install's own postinstall already copies the MediaPipe wasm +
      # hand_landmarker.task into public/ (see scripts/copy-mediapipe-assets.mjs).

      - name: Build (project-pages sub-path as Vite's base)
        # Project pages serve at https://<user>.github.io/<repo>/, not domain
        # root — pass that as --base so asset URLs resolve correctly (see
        # src/handTracker.js's use of import.meta.env.BASE_URL).
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: Hand_detection/Part_Zero_Bis_Web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
